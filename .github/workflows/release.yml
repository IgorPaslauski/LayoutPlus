name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'IgorPaslauski/LayoutPlus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/verify-dist.mjs
      - name: Validate semver tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not vX.Y.Z"
            exit 1
          fi
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag ${TAG} does not match package.json ${PKG}"
            exit 1
          fi
      - name: Zip extension
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          (cd dist && zip -r "../layout-plus-${VERSION}.zip" .)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists"
            exit 1
          fi
          gh release create "v${VERSION}" "layout-plus-${VERSION}.zip" \
            --title "v${VERSION}" \
            --notes "See CHANGELOG.md for v${VERSION}."
