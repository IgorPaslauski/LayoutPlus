<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" href="popup.css"/><title>Layout+</title></head><body><div id="app"><header><div class="identity"><div class="mark">L+</div><div><h1>Layout+</h1><small>ChatGPT appearance manager</small></div></div><label class="switch" title="Ativar extensão"><input id="enabled" type="checkbox" checked/><span></span></label></header><main><div class="section-label">LAYOUT</div><div class="presets"><button data-preset="default">Padrão</button><button data-preset="wide">Wide</button><button data-preset="developer">Developer</button></div><div class="control"><div class="control-top"><label for="conversationWidth">Largura da conversa</label><output id="conversationWidthValue"></output></div><input id="conversationWidth" type="range" min="640" max="2000" step="20"/></div><div class="control"><div class="control-top"><label for="composerWidth">Largura do prompt</label><output id="composerWidthValue"></output></div><input id="composerWidth" type="range" min="640" max="2000" step="20"/></div><div class="control"><div class="control-top"><label for="fontSize">Fonte das respostas</label><output id="fontSizeValue"></output></div><input id="fontSize" type="range" min="12" max="22" step="1"/></div><div class="section-label">CONTEÚDO</div><label class="checkbox-line"><input id="expandCode" type="checkbox"/><span>Expandir blocos de código</span></label><label class="checkbox-line"><input id="expandTables" type="checkbox"/><span>Expandir tabelas</span></label><footer><button id="reset" class="reset">Restaurar padrão</button><span id="status" role="status">Salvo automaticamente</span></footer></main></div><script src="popup.js"></script></body></html>
