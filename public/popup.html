<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title>Layout+</title>
</head>
<body>
  <header>
    <div>
      <h1>Layout+</h1>
      <p>ChatGPT</p>
    </div>
    <label class="switch" title="Ativar extensão">
      <input id="enabled" type="checkbox" checked>
      <span></span>
    </label>
  </header>
  <main>
    <div class="presets" role="group" aria-label="Predefinições">
      <button type="button" data-preset="default">Padrão</button>
      <button type="button" data-preset="wide">Amplo</button>
      <button type="button" data-preset="developer">Código</button>
    </div>
    <p id="presetNote" class="note" hidden>Ajuste manual</p>

    <div class="fields">
      <div class="control">
        <div class="control-top">
          <label for="conversationWidth">Conversa</label>
          <output id="conversationWidthValue"></output>
        </div>
        <input id="conversationWidth" type="range" min="640" max="2000" step="20">
      </div>
      <div class="control">
        <div class="control-top">
          <label for="composerWidth">Prompt</label>
          <output id="composerWidthValue"></output>
        </div>
        <input id="composerWidth" type="range" min="640" max="2000" step="20">
      </div>
      <div class="control">
        <div class="control-top">
          <label for="fontSize">Texto</label>
          <output id="fontSizeValue"></output>
        </div>
        <input id="fontSize" type="range" min="12" max="22" step="1">
      </div>
    </div>

    <div class="checks">
      <label class="check">
        <input id="expandCode" type="checkbox">
        <span>Código na largura toda</span>
      </label>
      <label class="check">
        <input id="expandTables" type="checkbox">
        <span>Tabelas na largura toda</span>
      </label>
    </div>

    <footer>
      <button id="reset" type="button">Restaurar</button>
      <span id="status" role="status">Salvo</span>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
