<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title>Layout+</title>
</head>
<body>
  <header>
    <div>
      <h1>Layout+</h1>
      <p>ChatGPT</p>
    </div>
    <label class="switch" data-i18n-title="enableTitle" title="Turn extension on">
      <input id="enabled" type="checkbox" checked>
      <span></span>
    </label>
  </header>
  <main>
    <div class="presets" role="group" data-i18n-label="presetsLabel" aria-label="Presets">
      <button type="button" data-preset="default" data-i18n="presetDefault">Default</button>
      <button type="button" data-preset="wide" data-i18n="presetWide">Wide</button>
      <button type="button" data-preset="developer" data-i18n="presetDeveloper">Code</button>
      <button type="button" data-preset="reading" data-i18n="presetReading">Read</button>
      <button type="button" data-preset="presentation" data-i18n="presetPresentation">Present</button>
    </div>
    <p id="presetNote" class="note" data-i18n="presetCustom" hidden>Manual adjustment</p>
    <p id="pageNote" class="note warn" data-i18n="pageMissing" hidden>The layout could not find this page</p>

    <div class="fields">
      <div class="control">
        <div class="control-top">
          <label for="conversationWidth" data-i18n="conversation">Conversation</label>
          <output id="conversationWidthValue"></output>
        </div>
        <input id="conversationWidth" type="range" min="480" max="2000" step="20">
      </div>
      <div class="control">
        <div class="control-top">
          <label for="textWidth" data-i18n="textWidth">Column</label>
          <output id="textWidthValue"></output>
        </div>
        <input id="textWidth" type="range" min="50" max="85" step="1">
      </div>
      <div class="control">
        <div class="control-top">
          <label for="composerWidth" data-i18n="composer">Prompt</label>
          <output id="composerWidthValue"></output>
        </div>
        <input id="composerWidth" type="range" min="480" max="2000" step="20">
      </div>
      <div class="control">
        <div class="control-top">
          <label for="composerMinHeight" data-i18n="composerMinHeight">Prompt height</label>
          <output id="composerMinHeightValue"></output>
        </div>
        <input id="composerMinHeight" type="range" min="0" max="320" step="8">
      </div>
      <div class="control">
        <div class="control-top">
          <label for="composerMaxHeight" data-i18n="composerMaxHeight">Prompt limit</label>
          <output id="composerMaxHeightValue"></output>
        </div>
        <input id="composerMaxHeight" type="range" min="0" max="480" step="8">
      </div>
      <button id="composerNative" class="text-button" type="button" data-i18n="composerNative">Native height</button>
      <div class="control">
        <div class="control-top">
          <label for="fontSize" data-i18n="fontSize">Text</label>
          <output id="fontSizeValue"></output>
        </div>
        <input id="fontSize" type="range" min="12" max="28" step="1">
      </div>
      <div class="control">
        <div class="control-top">
          <label for="lineHeight" data-i18n="lineHeight">Line spacing</label>
          <output id="lineHeightValue"></output>
        </div>
        <input id="lineHeight" type="range" min="14" max="20" step="1">
      </div>
      <div class="control">
        <div class="control-top">
          <label for="paragraphGap" data-i18n="paragraphGap">Paragraph gap</label>
          <output id="paragraphGapValue"></output>
        </div>
        <input id="paragraphGap" type="range" min="8" max="28" step="1">
      </div>
      <div class="control">
        <div class="control-top">
          <label for="codeFontSize" data-i18n="codeFontSize">Code size</label>
          <output id="codeFontSizeValue"></output>
        </div>
        <input id="codeFontSize" type="range" min="11" max="20" step="1">
      </div>
      <div class="control">
        <div class="control-top">
          <label for="codeLineHeight" data-i18n="codeLineHeight">Code spacing</label>
          <output id="codeLineHeightValue"></output>
        </div>
        <input id="codeLineHeight" type="range" min="12" max="20" step="1">
      </div>
      <div class="control">
        <div class="control-top">
          <label for="codeMaxHeight" data-i18n="codeMaxHeight">Code block height</label>
          <output id="codeMaxHeightValue"></output>
        </div>
        <input id="codeMaxHeight" type="range" min="0" max="800" step="40">
      </div>
      <div class="control">
        <label for="fontChoice" data-i18n="fontChoice">Font</label>
        <select id="fontChoice">
          <option value="system" data-i18n="fontSystem">System</option>
          <option value="serif" data-i18n="fontSerif">Serif</option>
          <option value="readable" data-i18n="fontReadable">Readable</option>
        </select>
      </div>
    </div>

    <div class="checks">
      <label class="check">
        <input id="expandCode" type="checkbox">
        <span data-i18n="expandCode">Full-width code</span>
      </label>
      <label class="check">
        <input id="expandTables" type="checkbox">
        <span data-i18n="expandTables">Full-width tables</span>
      </label>
      <label class="check">
        <input id="expandMedia" type="checkbox">
        <span data-i18n="expandMedia">Full-width images</span>
      </label>
      <label class="check">
        <input id="breakout" type="checkbox">
        <span data-i18n="breakout">Let blocks leave the column</span>
      </label>
      <label class="check">
        <input id="focusLatest" type="checkbox">
        <span data-i18n="focusLatest">Dim earlier replies</span>
      </label>
      <label class="check">
        <input id="codeWrap" type="checkbox">
        <span data-i18n="codeWrap">Wrap code lines</span>
      </label>
      <label class="check">
        <input id="sidebarAdjust" type="checkbox">
        <span data-i18n="sidebarAdjust">Adjust sidebar</span>
      </label>
    </div>
    <div class="fields">
      <div class="control">
        <div class="control-top">
          <label for="sidebarWidth" data-i18n="sidebarWidth">Sidebar</label>
          <output id="sidebarWidthValue"></output>
        </div>
        <input id="sidebarWidth" type="range" min="0" max="280" step="8">
      </div>
    </div>

    </div>

    <section class="named">
      <div class="named-row">
        <input id="presetName" type="text" maxlength="24" data-i18n-placeholder="presetNamePlaceholder" placeholder="Name">
        <button id="saveNamed" type="button" data-i18n="saveNamed">Save</button>
      </div>
      <div id="namedList"></div>
      <div class="named-row">
        <button id="exportNamed" type="button" data-i18n="exportNamed">Export</button>
        <label class="file">
          <input id="importNamed" type="file" accept="application/json,.json">
          <span data-i18n="importNamed">Import</span>
        </label>
      </div>
    </section>

    <footer>
      <button id="reset" type="button" data-i18n="reset">Restore</button>
      <span id="status" role="status" data-i18n="statusSaved">Saved</span>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
